# Fly.io config untuk AILoker — deploy paling simpel, tanpa database eksternal
# (SQLite disimpan di volume persisten /data).
app = "ailoker"
primary_region = "sin"   # Singapore, paling dekat ke Indonesia

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Volume persisten untuk file SQLite (dibuat sekali via CLI, lihat README)
[[mounts]]
  source = "ailoker_data"
  destination = "/data"

[env]
  PORT = "8000"
  DATABASE_PATH = "/data/ailoker.db"
