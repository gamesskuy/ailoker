{% extends "base.html" %}
{% block title %}Masuk — AILoker{% endblock %}
{% block content %}
<div class="grad-bg-soft min-h-[70vh] py-12 px-4">
  <div class="max-w-md mx-auto bg-white rounded-2xl border border-slate-200 shadow-xl shadow-indigo-100 p-8">
    <div class="text-center">
      <span class="grad-bg text-white font-extrabold w-11 h-11 rounded-xl grid place-items-center text-xl mx-auto shadow-md shadow-indigo-200">A</span>
      <h1 class="text-2xl font-extrabold text-slate-900 mt-4">Selamat datang kembali</h1>
      <p class="text-slate-500 text-sm mt-1">Masuk untuk lanjutkan perjalanan kariermu.</p>
    </div>
    <form action="/masuk" method="post" class="mt-7 space-y-4">
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1.5">Email</label>
        <input name="email" type="email" required class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="kamu@email.com">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1.5">Kata sandi</label>
        <input name="password" type="password" required class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••">
      </div>
      <button class="btn-primary w-full text-white font-bold py-3 rounded-xl shadow-md shadow-indigo-200">Masuk →</button>
    </form>
    <p class="text-center text-sm mt-5 text-slate-500">Belum punya akun? <a href="/daftar" class="text-indigo-700 font-bold">Daftar gratis</a></p>
  </div>
</div>
{% endblock %}
