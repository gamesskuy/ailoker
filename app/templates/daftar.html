{% extends "base.html" %}
{% block title %}Daftar — AILoker{% endblock %}
{% block content %}
<div class="grad-bg-soft min-h-[70vh] py-12 px-4">
  <div class="max-w-md mx-auto bg-white rounded-2xl border border-slate-200 shadow-xl shadow-indigo-100 p-8">
    <div class="text-center">
      <span class="grad-bg text-white font-extrabold w-11 h-11 rounded-xl grid place-items-center text-xl mx-auto shadow-md shadow-indigo-200">A</span>
      <h1 class="text-2xl font-extrabold text-slate-900 mt-4">Buat akun gratis</h1>
      <p class="text-slate-500 text-sm mt-1">Gratis selamanya. Tanpa kartu kredit.</p>
    </div>
    <form action="/daftar" method="post" class="mt-7 space-y-4">
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">Saya adalah</label>
        <div class="grid grid-cols-2 gap-2.5">
          <label class="border-2 border-slate-200 rounded-xl p-3.5 cursor-pointer text-center has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/60 transition">
            <input type="radio" name="role" value="seeker" checked class="hidden">
            <div class="text-2xl">🔍</div>
            <div class="font-bold text-sm mt-1">Pencari Kerja</div>
            <div class="text-xs text-slate-500 mt-0.5">Cari loker + skor AI</div>
          </label>
          <label class="border-2 border-slate-200 rounded-xl p-3.5 cursor-pointer text-center has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/60 transition">
            <input type="radio" name="role" value="company" class="hidden">
            <div class="text-2xl">🏢</div>
            <div class="font-bold text-sm mt-1">Perusahaan</div>
            <div class="text-xs text-slate-500 mt-0.5">Pasang loker + screening AI</div>
          </label>
        </div>
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1.5">Nama lengkap</label>
        <input name="nama" required class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Nama kamu">
      </div>
      <div id="field-perusahaan" class="hidden">
        <label class="block text-sm font-bold text-slate-700 mb-1.5">Nama perusahaan</label>
        <input name="perusahaan" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="PT Contoh Sejahtera">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1.5">Email</label>
        <input name="email" type="email" required class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="kamu@email.com">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1.5">Kata sandi <span class="font-normal text-slate-400">(min. 6 karakter)</span></label>
        <input name="password" type="password" required minlength="6" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••">
      </div>
      <button class="btn-primary w-full text-white font-bold py-3 rounded-xl shadow-md shadow-indigo-200">Buat Akun →</button>
    </form>
    <p class="text-center text-sm mt-5 text-slate-500">Sudah punya akun? <a href="/masuk" class="text-indigo-700 font-bold">Masuk</a></p>
  </div>
</div>
<script>
document.querySelectorAll('input[name=role]').forEach(r => r.addEventListener('change', () => {
  document.getElementById('field-perusahaan').classList.toggle('hidden', document.querySelector('input[name=role]:checked').value !== 'company');
}));
</script>
{% endblock %}
